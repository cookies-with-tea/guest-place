version: '3.8'

services:
  web:
    container_name: rust-guest-place
    build:
      context: ./
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "${APP_PORT}:${APP_PORT}"
    volumes:
      - ./:/opt/rust-guest-place/
    depends_on:
      - db

  db:
    image: postgres:16.0
    container_name: rust-guest-place-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 15s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: rust-guest-place-redis
    env_file: .env
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

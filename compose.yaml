services:
  db:
    image: postgres:16-alpine
    container_name: guest-place-db
    env_file: server/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guest-place}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guest-place}
      POSTGRES_DB: ${POSTGRES_DB:-guest-place}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guest-place} -d ${POSTGRES_DB:-guest-place}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: guest-place-redis
    env_file: server/.env
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-guest-place} --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-guest-place}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    container_name: guest-place-server
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file: server/.env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: ${APP_PORT:-8000}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      UPLOAD_DIR: /app/uploads
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - server_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-panel:
    container_name: guest-place-admin
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    ports:
      - "4173:4173"
      - "3001:3001"
      - "3002:3002"
      - "3003:3003"
      - "3004:3004"
      - "3005:3005"
      - "3006:3006"
      - "3007:3007"
      - "3008:3008"
    depends_on:
      - server

  client:
    container_name: guest-place-client
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
  server_uploads:

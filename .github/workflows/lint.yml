name: Lint Code

on:
  push:
    branches: [client]
  pull_request:
    branches: [client]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.6
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Run linters
        run: pnpm lint

name: CI
on:
  push:
    branches: [admin-panel, admin-panel-update]
  pull_request:
    branches: [admin-panel, admin-panel-update]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run linting
        run: pnpm lint

  type-check:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run TypeScript check
        run: pnpm type-check

  build:
    needs: [lint, type-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run build
        run: pnpm build

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test:unit

  # Replaces the old Snyk job (needed a SNYK_TOKEN secret that was never set — nothing in
  # this repo ever referenced one). `pnpm audit` needs no external service or secret.
  #
  # non-blocking by design, not an oversight: the current dependency tree already has 55
  # findings (5 low / 22 moderate / 22 high / 6 critical as of 2026-10-29, mostly transitive
  # dev-only tooling like Cypress/Storybook — checked locally with `pnpm audit`, it exits 1
  # immediately). A blocking gate here would be red from the first run, exactly the trap the
  # dependency-check job below already fell into. This job's job is visibility (every run
  # posts the findings to the Actions log) while a real dependency-upgrade pass happens
  # separately; flip `continue-on-error` to `false` once that baseline is clean.
  security:
    needs: setup
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies (non-blocking — see job comment)
        run: pnpm audit --audit-level=high

  # Both steps are broken as written, confirmed locally, not just guessed:
  # `pnpm outdated --parseable` exits 1 whenever *any* dependency is outdated (currently 51 —
  # a normal, permanent state for any real project, not a bug), so this would fail every run
  # regardless of code quality. `dependency-cruiser@15.5.0 --validate .` crashes outright on
  # Node 22/24 with "node:fs does not provide an export named 'R_OK'" (its own bug — R_OK has
  # only ever lived under fs.constants) before it gets anywhere near validating the graph.

name: Smoke Test

# Brings up db/redis (Docker) and the dev services natively (server, admin-panel's
# admin-shell — client/ isn't on this branch yet, see IMPROVEMENTS.md section 0) and
# checks each one actually answers HTTP. See `smoke-test` in the root Makefile and
# scripts/smoke-test.mjs for the full explanation. This only became wireable once
# server/ and admin-panel/ lived on the same branch as each other.

on:
  push:
    branches: [main, main-v2]
  pull_request:
    branches: [main, main-v2]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: admin-panel/pnpm-lock.yaml

      # Dummy, non-secret values — this never sends real email or talks to anything
      # outside this job's own Docker containers.
      - name: Write server/.env
        run: |
          cat > server/.env <<'EOF'
          APP_HOST=127.0.0.1
          APP_PORT=8000
          APP_DB_ENGINE=postgres
          PUBLIC_URL=http://127.0.0.1:8000
          CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:4173
          ACCESS_TOKEN_LIFETIME_MINUTES=15
          REFRESH_TOKEN_TTL_MINUTES=1440
          JWT_SECRET=ci-smoke-test-secret
          SUPERADMIN_EMAIL=admin@example.com
          SUPERADMIN_PASSWORD=admin
          POSTGRES_DB=guest-place
          POSTGRES_USER=guest-place
          POSTGRES_PASSWORD=guest-place
          POSTGRES_PORT=5432
          POSTGRES_HOST=127.0.0.1
          POSTGRES_SSLMODE=disable
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          REDIS_PASSWORD=guest-place
          SMTP_HOST=localhost
          SMTP_PORT=587
          SMTP_USERNAME=ci
          SMTP_PASSWORD=ci
          SMTP_FROM=ci@example.com
          MAIL_FROM=ci@example.com
          FRONTEND_URL=http://localhost:3000
          EOF

      - name: Write admin-panel/.env
        run: cp admin-panel/.env.example admin-panel/.env

      - name: Install admin-panel dependencies
        working-directory: admin-panel
        run: pnpm install --frozen-lockfile

      - name: Run smoke test
        run: node scripts/smoke-test.mjs
